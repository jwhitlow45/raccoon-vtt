<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the map run under the notch and home bar.
         The UI keeps clear of them with env(safe-area-inset-*).
         interactive-widget=resizes-content has Android Chrome shrink the page
         for the on-screen keyboard, so a sheet at the foot stays above it.
         iOS Safari ignores it and shrinks only the visual viewport, which
         lib/keyboardInset.ts reads. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#16161a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <!-- The interface font (lib/interFont.ts), fetched beside the app's
         script rather than once its styles are read, so the first text
         drawn is usually Inter already. Fonts are always fetched with CORS,
         so a preload without crossorigin would not be reused and the file
         would come twice. The italic loads when some text needs it. -->
    <link rel="preload" href="/fonts/InterVariable-8a540aa8.woff2" as="font" type="font/woff2" crossorigin />
    <title>RaccoonVTT</title>
  </head>
  <body>
    <div id="root">
      <!-- Shown while the app's script downloads, which takes seconds on a slow
           phone. React replaces it. It appears only after 300 ms, so a quick
           load never flashes it. Styled in globals.css, since the CSP refuses
           style attributes in the page itself. -->
      <p class="rvtt-boot" role="status">Loading RaccoonVTT…</p>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
