# Self-hosting raccoon-vtt with the published image (README.md,
# "Self-hosting with the published image"). This file and an .env next to it
# are all a host needs:
#
#   docker compose up -d
#   docker compose --profile https up -d      with Caddy as the HTTPS front end
#
# GENERATED by scripts/selfhost-compose.ts from docker-compose.server.yml,
# docker/squid.conf and docker/backup.sh. Do not edit it: change those and
# run `pnpm selfhost`. A unit test fails while this file differs from what
# the generator makes.
#
# It is the server stack, docker-compose.server.yml in the repository, whose
# header draws the whole picture, with these changes:
#
#   - `raccoon` runs the published image instead of building one.
#   - squid.conf and backup.sh are inline, in the configs at the end. The
#     one-shot `config-files` service copies them onto the raccoon-config
#     volume, and each service that reads one mounts it from there,
#     read-only, at the path where the server stack bind-mounts the file.
#   - An optional `https` profile adds Caddy, which publishes ports 80 and
#     443 and gets the certificate itself.
#   - TRUST_CF_CONNECTING_IP comes from .env and is 0 unless .env sets it,
#     the app's own default. Most hosts are not behind Cloudflare, and
#     trusting the header anywhere else lets a visitor pick an address.
#
# Without the profile nothing publishes a port, as in the server stack: your
# own proxy or tunnel joins raccoon-edge and sends the site's hostname to
# http://raccoon:3000 (README.md, "Put HTTPS in front of it").
#
# The internal networks set `gateway_mode_ipv4: isolated`, which needs Docker
# Engine 28 or later. The inline configs, the volume `subpath` mounts and
# `restart` in depends_on need Docker Compose 2.31 or later, the oldest
# tested.
#
# Secrets come from .env, which compose reads for the ${...} substitutions
# below. The required ones use `:?`, so compose refuses to start without
# them instead of booting half configured.

name: raccoon

# What the backup and restore services share (docs/design-v1-dm-tools.md
# 3.17): how they reach the database and the server's time zone. Never
# ROOM_SECRET_KEY, which no backup needs: the dumps hold the sealed player
# passwords, and only the app's key opens them.
x-backup-env: &backup-env
  PGHOST: postgres
  PGUSER: raccoon
  PGDATABASE: raccoon
  PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  TZ: ${TZ:-UTC}

services:
  # ----------------------------------------------------------------- app
  raccoon:
    # The published image. RACCOON_VERSION in .env pins another release.
    image: ${RACCOON_IMAGE:-docker.io/jwhitlow45/raccoon-vtt}:${RACCOON_VERSION:-0.1}
    networks:
      # One network per thing it talks to. `raccoon-edge` is how the tunnel
      # reaches it, `raccoon-data` how it reaches postgres, `raccoon-proxy`
      # its one way out. The proxy is kept off the edge network so the tunnel
      # container cannot use it as an open way out.
      raccoon-edge:
        # The front end points at http://raccoon:3000. A shared proxy or
        # tunnel may join other projects' edge networks too, where a service
        # named `app` is common, so this name is specific to this site and
        # cannot resolve to the wrong container.
        aliases:
          - raccoon
      raccoon-data: {}
      raccoon-proxy: {}
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://raccoon:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/raccoon
      # The exact origin, scheme and host, no trailing slash. The WebSocket
      # Origin check and CSRF compare against it character for character.
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env, for example https://vtt.example.com}
      # Keeps each room's player password readable for its DM, so the DM can
      # show the player link at any time (design 10.2). Changing it later
      # makes the stored passwords unreadable until each DM sets a new one.
      - ROOM_SECRET_KEY=${ROOM_SECRET_KEY:?set ROOM_SECRET_KEY in .env, made with openssl rand -base64 32}
      - ASSET_DIR=/data/assets
      # From .env, and 0 unless .env sets it, the app's own default: limits
      # key on the address that connected. env.example says when 1, which
      # takes the address from the CF-Connecting-IP header, is safe.
      - TRUST_CF_CONNECTING_IP=${TRUST_CF_CONNECTING_IP:-0}
      # Every outbound call goes through squid, on the port that matches its
      # trust (design section 10.6). The app passes these to an explicit
      # undici ProxyAgent and never reads HTTPS_PROXY.
      - EGRESS_STRICT_PROXY=http://egress:3128
      - EGRESS_PUBLIC_PROXY=http://egress:3129
      # Bare entries pass the value from .env when it is there and nothing at
      # all when it is not. The app treats an empty value as unset for these.
      # Without SERPAPI_KEY image search uses Openverse alone. Turnstile needs
      # both of its keys or neither, and so does an Openverse registration.
      - SERPAPI_KEY
      - OPENVERSE_CLIENT_ID
      - OPENVERSE_CLIENT_SECRET
      - TURNSTILE_SITE_KEY
      - TURNSTILE_SECRET
      # The admin page at /admin exists only while this is set (an argon2id
      # hash from `node scripts/admin.ts hash-password`, single-quoted in
      # .env). This service alone receives it.
      - ADMIN_PASSWORD_HASH
      # Abuse limits. The defaults match server/config.ts. They are spelled
      # out because an empty value would otherwise reach the app as 0 and
      # stop it booting.
      - ROOMS_PER_IP_PER_DAY=${ROOMS_PER_IP_PER_DAY:-5}
      - ROOMS_PER_DAY=${ROOMS_PER_DAY:-20}
      - ROOM_QUOTA_MB=${ROOM_QUOTA_MB:-1024}
    volumes:
      # Uploaded images, plus room exports copied in for `admin.ts import`.
      - raccoon-assets:/data/assets
    depends_on:
      postgres:
        condition: service_healthy
      # Healthy, not started: squid has bound its ports by then, so the
      # first image search after a deploy does not fail at the proxy.
      egress:
        condition: service_healthy
    restart: unless-stopped
    init: true
    # Shutdown closes every socket with 1012, lets each room finish its
    # commit and write its snapshot, then closes the pool, all within 25 s
    # (design section 15.4). This leaves room for that before Docker kills it.
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    logging:
      driver: local
    deploy:
      resources:
        limits:
          # One Node process. Image processing runs one sharp job at a time
          # and argon2 two hashes at a time, so more than this would sit idle.
          cpus: "1.5"
          # A 100 megapixel map upload, the largest the app accepts, peaked
          # at about 750 MiB for the whole container when measured. The rest
          # is room state (at most 8 MiB per loaded room) and sockets.
          memory: 1536m
          # About 16 in use at rest: the init shim, Node's threads and the
          # libuv pool. The cap stops a runaway, nothing more.
          pids: 256

  # ------------------------------------------------------------------ db
  postgres:
    # The backup and restore services run this same image, so pg_dump and
    # pg_restore match the server's version exactly.
    image: &postgres-image postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    networks:
      # Only the app shares this network, and it is internal, so the database
      # is unreachable from the host, the tunnel and every other container.
      # For psql: `docker compose exec postgres
      # psql -U raccoon -d raccoon`.
      - raccoon-data
    environment:
      POSTGRES_USER: raccoon
      # No default here, unlike the development file. Postgres reads this
      # only when it initializes an empty data directory, so changing it later
      # does nothing on its own. It is interpolated into DATABASE_URL, so it
      # must be URL safe (README.md shows how to generate one).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: raccoon
    volumes:
      - raccoon-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raccoon -d raccoon"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The official entrypoint starts as root to fix ownership of the data
      # directory, then drops to the postgres user. These five are what that
      # takes, and nothing else.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      # The unix socket and lock file, and scratch space. The data itself is
      # on the volume.
      - /var/run/postgresql:mode=3777,size=8m
      - /tmp:mode=1777,size=64m
    logging:
      driver: local
    deploy:
      resources:
        limits:
          # The app's pool opens at most 10 connections, and postgres runs a
          # process per connection.
          cpus: "1.0"
          memory: 512m
          pids: 128

  # -------------------------------------------------------------- backup
  # A nightly pg_dump, read back whole, and a copy of the images it names,
  # onto the raccoon-backups volume, kept 7 days and 4 weeks
  # (docs/design-v1-dm-tools.md 3.17, docker/backup.sh, README.md).
  #
  #   docker compose exec backup sh /backup/backup.sh once
  #
  # runs one now, for before an update.
  backup:
    image: *postgres-image
    command: ["sh", "/backup/backup.sh"]
    # Root on purpose, with no capabilities. The image's postgres user is
    # UID 70, and a new named volume comes up root's, which only CAP_CHOWN
    # could change. Without capabilities root writes only what root owns
    # (the backups volume) and reads the images as anyone may, through a
    # read-only mount.
    user: "0:0"
    networks:
      # Postgres and nothing else: no route out at all.
      - raccoon-data
    environment:
      <<: *backup-env
      # HH:MM in TZ. Unset or empty means 04:00.
      BACKUP_AT: ${BACKUP_AT:-04:00}
    volumes:
      - &backup-script
        type: volume
        source: raccoon-config
        target: /backup/backup.sh
        read_only: true
        volume:
          subpath: backup.sh
      - raccoon-backups:/backups
      - raccoon-assets:/assets:ro
    depends_on:
      postgres:
        condition: service_healthy
      config-files:
        condition: service_completed_successfully
        restart: true
    restart: unless-stopped
    # So `docker compose stop` ends the sleeping loop at once.
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # The copy's working lists. The dump goes straight to the volume.
      - /tmp:mode=1777,size=16m
    logging:
      driver: local
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
          pids: 64

  # A restore from the backups volume, which never starts with the others:
  #
  #   docker compose --profile restore run --rm restore sh /backup/backup.sh restore <dump name>
  #
  # README.md has the order around it. It runs as the app's own user, UID
  # 1000, so every folder and file it puts on the image volume is the app's,
  # and it holds the backup's lock throughout, so no backup's retention can
  # delete the chosen dump's images partway through.
  restore:
    image: *postgres-image
    profiles: ["restore"]
    user: "1000:1000"
    networks:
      - raccoon-data
    environment: *backup-env
    volumes:
      - *backup-script
      - raccoon-backups:/backups:ro
      - raccoon-assets:/data/assets
    depends_on:
      postgres:
        condition: service_healthy
      config-files:
        condition: service_completed_successfully
        restart: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    logging:
      driver: local
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
          pids: 64

  # -------------------------------------------------------------- egress
  # The only container here that can reach the internet. Its rules and the
  # reasoning behind them are in docker/squid.conf.
  egress:
    # Pinned by digest, so the squid.conf behavior that was tested holds.
    # Refresh deliberately with
    # `docker buildx imagetools inspect ubuntu/squid:latest`.
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    networks:
      # The only container on both sides of the boundary. `raccoon-proxy` is
      # internal and carries the app. `raccoon-egress` is an ordinary bridge
      # and carries nothing else.
      - raccoon-proxy
      - raccoon-egress
    volumes:
      - type: volume
        source: raccoon-config
        target: /etc/squid/squid.conf
        read_only: true
        volume:
          subpath: squid.conf
    depends_on:
      config-files:
        condition: service_completed_successfully
        restart: true
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # squid starts as root, binds its ports and drops to the `proxy` user.
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      # The image's entrypoint tails /var/log/squid to the container's
      # output, so `docker compose logs egress` lists every destination the
      # app asked for. In memory, so nothing accumulates on disk.
      - /var/log/squid:mode=1777,size=32m
      - /var/spool/squid:mode=1777,size=32m
      - /run:mode=1777,size=8m
      - /tmp:mode=1777,size=16m
    healthcheck:
      # bash's /dev/tcp, because the image has no curl, wget, nc or
      # squidclient. Named explicitly, because /bin/sh here is dash, which has
      # no /dev/tcp. Opening both ports proves squid is accepting. It does not
      # try a real CONNECT, so an outage at SerpApi never shows up as this
      # proxy being broken.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128 && exec 4<>/dev/tcp/127.0.0.1/3129"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: local
    deploy:
      resources:
        limits:
          # It shuffles bytes between two sockets and caches nothing.
          cpus: "0.5"
          memory: 256m
          pids: 128

  # -------------------------------------------------------- config files
  # Copies squid.conf, backup.sh and the Caddyfile from the configs at the
  # end of this file onto the raccoon-config volume, then exits.
  #
  # Compose can put an inline config only into a container whose root
  # filesystem it can write, and refuses to for a read-only service. So
  # this copier is the one service here that is not read-only. It has no
  # network and no capabilities, and it ends within a second. Root on
  # purpose, as the backup service is: a new named volume comes up root's.
  #
  # Compose does not count a config's content as part of a service, so the
  # label holds the configs' hash: a changed file changes the label, and
  # `docker compose up -d` recreates this copier. `restart: true` in each
  # reader's depends_on then restarts the reader, which is what makes it
  # read the new file. A file is replaced rather than rewritten, because the
  # backup loop's shell reads its script as it runs. A copy left behind by a
  # run that died is removed first. It is read-only, and root without
  # capabilities cannot write into it, so the copy must not depend on cp
  # replacing it (busybox's does, other cps need -f).
  config-files:
    image: *postgres-image
    labels:
      raccoon.config-sha256: "fa1b73293f1bf299c08cc3891061ba17fb65938614d0212a5b98d86fc2fdd0b7"
    command:
      - sh
      - -c
      - |
        set -eu
        for f in squid.conf backup.sh Caddyfile; do
          cmp -s "/src/$$f" "/config/$$f" && continue
          rm -f "/config/.$$f.new"
          cp "/src/$$f" "/config/.$$f.new"
          mv -f "/config/.$$f.new" "/config/$$f"
        done
    user: "0:0"
    network_mode: none
    configs:
      - source: squid-conf
        target: /src/squid.conf
      - source: backup-sh
        target: /src/backup.sh
      - source: caddyfile
        target: /src/Caddyfile
    volumes:
      - raccoon-config:/config
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64m
          pids: 16

  # --------------------------------------------------------------- https
  # The optional HTTPS front end, for a host with ports 80 and 443 open to
  # the internet and a DNS record for the site pointing at it. It starts
  # only with the `https` profile: `--profile https` on every command, or
  # COMPOSE_PROFILES=https in .env. Leave it off when your own proxy or
  # tunnel serves the site.
  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    profiles: ["https"]
    networks:
      # raccoon-edge to reach the app, as any front end does. raccoon-https
      # for the internet: the published ports and the certificate
      # authority, which the internal raccoon-edge cannot carry.
      - raccoon-edge
      - raccoon-https
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3.
      - "443:443/udp"
    # Names resolve through Cloudflare, as squid's do, rather than through the
    # host's resolver, which may sit on the LAN that README.md's firewall
    # rules for this bridge keep Caddy away from. Docker's own DNS still
    # answers for raccoon.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      # The Caddyfile's {$SITE_ADDRESS}.
      SITE_ADDRESS: ${SITE_ADDRESS:-${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env, for example https://vtt.example.com}}
    volumes:
      - type: volume
        source: raccoon-config
        target: /etc/caddy/Caddyfile
        read_only: true
        volume:
          subpath: Caddyfile
      # The certificates and the ACME account. Losing them costs only a new
      # certificate, within the certificate authority's rate limits.
      - raccoon-caddy:/data
    depends_on:
      config-files:
        condition: service_completed_successfully
        restart: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Caddy runs as root in its image, and binding ports 80 and 443 takes
      # this. Without the rest, root writes only what root owns: its volume
      # and the in-memory folders below.
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      # Caddy's autosave of the config it runs (XDG_CONFIG_HOME).
      - /config:mode=0700,size=8m
      - /tmp:mode=1777,size=16m
    healthcheck:
      # The admin API, which listens on the container's own loopback only,
      # answers once a config is loaded. busybox wget, as the image has no
      # curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: local
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
          pids: 128

networks:
  # The front end's way in. Created here and joined by the proxy or tunnel
  # project as `external: true`. Internal, so joining it gives the front end
  # a route to the app and nothing else, in particular not to postgres, which
  # is on another network.
  #
  # All three internal networks have pinned subnets, so host firewall rules
  # can name them and a recreate never moves them. A daemon-chosen range has
  # been seen to land on a bridge that carried no traffic at all, while one
  # with identical options on 192.168.x worked. Change the subnets if they
  # clash with networks on your host.
  raccoon-edge:
    name: raccoon-edge
    ipam:
      config:
        - subnet: 192.168.206.0/24
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-rvtt-edge
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      # Inert while the daemon gives this bridge no IPv6, but a daemon with
      # IPv6 enabled would otherwise hand it a v6 gateway on the host.
      com.docker.network.bridge.gateway_mode_ipv6: isolated

  # The app and the database, alone together.
  raccoon-data:
    name: raccoon-data
    ipam:
      config:
        - subnet: 192.168.207.0/24
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-rvtt-data
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated

  # The app and the proxy, alone together.
  raccoon-proxy:
    name: raccoon-proxy
    ipam:
      config:
        - subnet: 192.168.208.0/24
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-rvtt-proxy
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated

  # The one bridge with a route off the machine, so the one that keeps a real
  # gateway, and squid alone could address this host through it. squid's own
  # rules refuse every private range, and two host firewall rules back that
  # up against a compromised squid or a DNS rebind (design section 15.3,
  # README.md). The fixed bridge name keeps those rules valid when the
  # network is recreated.
  raccoon-egress:
    name: raccoon-egress
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-rvtt-egress
      # No container-to-container traffic on this network. There is only one
      # container on it, and this keeps that true.
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        # Tiny, since only the egress proxy sits on it. Change it if it
        # clashes with a network on your host.
        - subnet: 172.31.243.0/28

  # The https profile's way to the internet, with a real gateway like
  # raccoon-egress, and Caddy alone on it. Pinned beside raccoon-egress for
  # the same reasons. Change it if it clashes with a network on your host.
  raccoon-https:
    name: raccoon-https
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-rvtt-https
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        - subnet: 172.31.243.16/28

volumes:
  raccoon-db:
  raccoon-assets:
  # The backups, on the same disk. README.md says how to size it and how to
  # copy it off the server.
  raccoon-backups:
  # The files config-files copies. Safe to delete while the stack is down:
  # the next `up` writes them again.
  raccoon-config:
  # Caddy's certificates, for the https profile.
  raccoon-caddy:

# The files the services read, inline so this file is all a host needs. Every
# $ is doubled, which Compose reads as one $ and never as a variable.
# config-files copies them onto the raccoon-config volume.
configs:
  # docker/squid.conf, byte for byte.
  squid-conf:
    content: |
      # The app's only way out (design sections 10.6 and 15.3).
      #
      # The app container sits on internal-only docker networks, so it has no route
      # to the internet, to the host, or to anything else running on it. This proxy
      # is the single exception. It listens on two ports,
      # each with its own rules, because the app makes two kinds of outbound call
      # with very different trust:
      #
      #   3128 "strict"  serpapi.com (image search, its account API and its hosted
      #                  thumbnails), api.openverse.org (the second image search
      #                  and its access token), character-service.dndbeyond.com
      #                  (a public D&D Beyond character a member imports into a
      #                  stat block, docs/design-v1-pc-stats.md 6.3) and, when
      #                  Turnstile is configured, challenges.cloudflare.com.
      #                  Nothing else. Take character-service.dndbeyond.com out of
      #                  the list below to turn the D&D Beyond link import off:
      #                  pasting a character's JSON still works.
      #   3129 "public"  any host on port 443, for importing an image from a URL a
      #                  member pasted. Never a private, loopback, link-local,
      #                  CGNAT, multicast or reserved address.
      #
      # The app picks the port per call with an explicit undici ProxyAgent
      # (server/assets/egress.ts), never through HTTPS_PROXY, so a call site shows
      # which way it goes out and nothing can silently go direct.

      http_port 3128 name=strict
      http_port 3129 name=public

      acl strict_port myportname strict
      acl public_port myportname public

      # Exact names, no leading dot. A leading dot would also match every
      # subdomain, which is a wider hole than this needs.
      acl strict_hosts dstdomain serpapi.com api.openverse.org challenges.cloudflare.com character-service.dndbeyond.com

      # Against a name that resolves inward, on both ports. The networks around
      # this proxy already keep the app from addressing the host, but a hostname is
      # resolved here, so without these lines anybody who could point a DNS record
      # at 172.17.0.1 would have a route to the host through this proxy. Squid
      # resolves before it applies `dst`, so this also catches a rebind. A record
      # with a zero TTL could in principle resolve differently between this check
      # and the connect, which is why the host firewall rules in design section
      # 15.3 back it up.
      #
      # The IPv6 list has no ::ffff:0:0/96 (IPv4-mapped) entry. Squid stores every
      # IPv4 address in that mapped form, so the entry matched every IPv4
      # destination and denied all traffic (tested against the pinned image). A
      # mapped address such as ::ffff:10.0.0.1 is compared as the IPv4 it carries,
      # so the IPv4 list above already refuses the private ones (also tested).
      acl to_private dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
      acl to_private6 dst ::1 ::/128 fc00::/7 fe80::/10 64:ff9b::/96 2002::/16

      acl SSL_ports port 443
      acl CONNECT method CONNECT

      http_access deny to_private
      http_access deny to_private6
      http_access deny CONNECT !SSL_ports
      # Plain http is not allowed out at all. Every call the app makes is https,
      # tunnelled with CONNECT, and the app checks the certificate itself.
      http_access deny !CONNECT
      http_access allow strict_port strict_hosts
      http_access allow public_port
      http_access deny all

      # A tunnel, not a cache. There is no cache_dir, so nothing is written to disk
      # and the container can stay read-only.
      cache deny all

      # Resolve through Cloudflare rather than the host's resolver. The host
      # resolver would be reached across the docker gateway, which is the thing
      # this whole arrangement is built to avoid, and pointing at it would also
      # make name resolution break the moment a firewall rule blocks that path.
      dns_nameservers 1.1.1.1 1.0.0.1

      # Two limits bound a CONNECT, on both ports. connect_timeout gives up on one
      # address of the host after 10 seconds, and forward_timeout gives up the whole
      # search across its addresses after 10 seconds. A host such as D&D Beyond's
      # has several addresses, so the first alone would still let a dead host hold
      # a CONNECT for a minute or more. The app gives each outbound request 10 to
      # 30 seconds in all, and with squid's defaults (a minute an address, four
      # minutes in all) a stuck CONNECT keeps the requests queued behind it failing,
      # and holds a server stop, for as long. Neither limit touches a tunnel once it
      # is open.
      connect_timeout 10 seconds
      forward_timeout 10 seconds

      # No ICMP pinger. It needs NET_RAW, which the compose file drops, so with it
      # on squid logs "FATAL: Unable to open any ICMP sockets" at every start while
      # carrying on fine. A FATAL that is not fatal teaches people to skim past the
      # log. This proxy picks no route by latency, so the pinger has no job here.
      pinger_enable off

      # Logs go to files that the image's entrypoint tails to the container's
      # output, so `docker compose logs` is the whole story. Every allowed CONNECT
      # is recorded with its destination, which makes "did this container talk to
      # anything it should not have" an answerable question. No credential passes
      # through here in the clear: a CONNECT carries the hostname only, and the
      # SerpApi key and the Openverse client secret and token are inside the TLS
      # session this proxy cannot see into.
      # Not /dev/stdout: squid drops to the unprivileged `proxy` user before it
      # opens its logs, cannot open /dev/stdout as that user, and exits. The
      # directory is a tmpfs in the compose file, so nothing accumulates on disk.
      access_log stdio:/var/log/squid/access.log
      cache_log /var/log/squid/cache.log
      cache_store_log none
      # No pid file, so nothing needs /run to be writable either.
      pid_filename none

      # Say nothing about what is behind this.
      via off
      forwarded_for delete
      httpd_suppress_version_string on

  # docker/backup.sh, byte for byte.
  backup-sh:
    content: |
      #!/bin/sh
      # Database and image backups (docs/design-v1-dm-tools.md 3.17).
      #
      # The `backup` service in docker-compose.server.yml runs this file, mounted
      # read-only, in the postgres service's own pinned image, so pg_dump matches
      # the server's version exactly:
      #
      #   sh /backup/backup.sh                     the nightly loop, at BACKUP_AT in TZ
      #   sh /backup/backup.sh once                one backup now, or "A backup is running"
      #   sh /backup/backup.sh restore <dump>      in the `restore` service only (README.md)
      #
      # The backup service runs as root with no capabilities, so it writes only
      # what root owns (the backups volume) and reads the image volume through a
      # read-only mount, which works because the app writes its files readable by
      # others. The restore service runs as the app's own user, UID 1000, so every
      # folder and file it puts back on the image volume is the app's.
      #
      # What makes a backup good is a completion record, `<name>.good`, written on
      # the backups volume last of all, only by a run that passed every step. The
      # `backup_runs` table is only a log for the admin page: retention never
      # reads it and the dumps leave it out, so a database restored from an older
      # dump can never make a run forget, or delete, the backups made after it.
      #
      # One run at a time: the nightly loop, `once` and `restore` all take one
      # flock on /backups/.lock before anything else and hold it through the log.
      #
      # Variables named BACKUP_TEST_* exist for scripts/backup-check.ts alone.
      # The compose files never set them, and unset they change nothing.

      set -u
      set -o pipefail
      umask 022

      BACKUPS=/backups
      STORE="$$BACKUPS/assets"
      LOCK="$$BACKUPS/.lock"
      # The image volume: read-only for the backup, writable for the restore.
      SOURCE=/assets
      TARGET=/data/assets
      FLOOR=$${BACKUP_TEST_FLOOR_BYTES:-2147483648}
      DAILY=7
      WEEKLY=4
      LOG_DAYS=90
      RUN_ID_PATTERN='[a-z0-9]\{8\}'
      NAME_PATTERN="^raccoon-[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-[0-9]\{6\}-$$RUN_ID_PATTERN\$$"
      NO_LOG="The database has no backup log yet. Start raccoon first, then run backup.sh once."

      say() { printf '%s\n' "$$*"; }
      complain() { printf '%s\n' "$$*" >&2; }

      # psql with the PG* variables the service sets, SQL on stdin, so psql
      # variables (-v name=value, used as :'name') are interpolated and quoted.
      sql() { psql -X -q -A -t -v ON_ERROR_STOP=1 "$$@"; }

      size_of() { stat -c %s "$$1" 2>/dev/null; }

      # The length of a regular file, or a failure for anything else: a missing
      # path, a folder, or a size that cannot be read. Two missing files must
      # never compare equal as two empty answers.
      file_size() {
        [ -f "$$1" ] || return 1
        n=$$(stat -c %s "$$1" 2>/dev/null) || return 1
        case $$n in '' | *[!0-9]*) return 1 ;; esac
        printf '%s\n' "$$n"
      }

      # A line of a dump's list, as list_dump writes it, so no line can name a
      # path outside the image folders.
      LIST_LINE='^[0-9a-f]\{2\}/[0-9a-f]\{64\}-[a-z]\{1,\}-[a-z]\{1,\}-v[1-9][0-9]*\.webp$$'

      # How many images a dump's list names that the restore could not put in
      # place: neither a whole copy on the backups volume nor a file already on
      # the image volume, which the restore never overwrites.
      unrestorable() {
        bad=0
        while IFS= read -r path; do
          if ! printf '%s\n' "$$path" | grep -q "$$LIST_LINE"; then
            bad=$$((bad + 1))
          elif ! file_size "$$STORE/$$path" > /dev/null && ! file_size "$$TARGET/$$path" > /dev/null; then
            bad=$$((bad + 1))
          fi
        done < "$$1"
        printf '%s\n' "$$bad"
      }

      free_bytes() {
        kb=$$(df -Pk "$$BACKUPS" | awk 'NR == 2 { print $$4 }')
        printf '%s\n' "$$((kb * 1024))"
      }

      # A record's field, `key=value` on its own line.
      field() { sed -n "s/^$$2=//p" "$$1" | head -n 1; }

      # Pauses once at a named point for the check, which kills or resumes the run.
      PAUSED=""
      test_pause() {
        [ "$${BACKUP_TEST_PAUSE:-}" = "$$1" ] && [ -z "$$PAUSED" ] || return 0
        PAUSED=$$1
        : > "/tmp/.test-paused-$$1"
        while [ ! -e /tmp/.test-resume ]; do sleep 0.1; done
        rm -f /tmp/.test-resume "/tmp/.test-paused-$$1"
      }

      # The lock ----------------------------------------------------------------

      # Made by the backup service, which owns the volume, readable by everyone so
      # the restore service, as UID 1000 on a read-only mount, can take it too.
      ensure_lock() {
        [ -e "$$LOCK" ] || : > "$$LOCK"
        chmod 0644 "$$LOCK"
      }

      # BusyBox flock takes the lock on a read-only descriptor.
      take_lock() {
        # A failed redirection on exec would end the whole script, so look first.
        [ -r "$$LOCK" ] || return 1
        exec 9<"$$LOCK"
        flock -n 9
      }

      release_lock() {
        flock -u 9 2>/dev/null
        exec 9<&-
      }

      # What the dump names and what is where -------------------------------------

      # The variant files the dump's asset rows name, one per line as
      # `<first two hex>/<sha256 hex>-<kind>-<variant>-v<pipeline>.webp`, the path
      # server/assets/store.ts builds (variantPath). COPY's text format writes a
      # bytea as \\x<hex> and a text[] as {a,b}. A row that does not parse fails
      # the whole list, since a list that leaves an image out is not a backup.
      list_dump() {
        pg_restore --data-only --table=assets --file=- "$$1" | awk '
          /^COPY public\.assets \(/ {
            cols = $$0
            sub(/^COPY public\.assets \(/, "", cols)
            sub(/\) FROM stdin;$$/, "", cols)
            n = split(cols, names, ", ")
            for (i = 1; i <= n; i++) col[names[i]] = i
            inside = 1
            next
          }
          inside && $$0 == "\\." { inside = 0; next }
          inside {
            split($$0, f, "\t")
            hex = f[col["sha256"]]
            sub(/^\\\\x/, "", hex)
            kind = f[col["kind"]]
            pipeline = f[col["pipeline"]]
            variants = f[col["variants"]]
            gsub(/[{}]/, "", variants)
            nv = split(variants, v, ",")
            if (hex !~ /^[0-9a-f]{64}$$/ || kind !~ /^[a-z]+$$/ || pipeline !~ /^[1-9][0-9]*$$/ || nv < 1) { bad = 1; exit 1 }
            for (j = 1; j <= nv; j++) {
              if (v[j] !~ /^[a-z]+$$/) { bad = 1; exit 1 }
              print substr(hex, 1, 2) "/" hex "-" kind "-" v[j] "-v" pipeline ".webp"
            }
          }
          END { if (bad) exit 1 }
        ' | sort -u
      }

      # Sizes of what is on the image volume, in its trash, and in the copy, then
      # one line per listed file:
      #   ok <path> <size>              copied at the source's length
      #   kept <path>                   its source is gone, and its copy is in place
      #   copy <path> <size> <source>   missing from the copy, or at another length
      #   missing <path>                gone everywhere
      plan() {
        dir=$$(mktemp -d)
        ( cd "$$SOURCE" && find . -mindepth 2 -maxdepth 2 -type f -name '*.webp' | grep -E '^\./[0-9a-f]{2}/' | xargs -r stat -c '%s %n' ) > "$$dir/live" 2>/dev/null
        if [ -d "$$SOURCE/trash" ]; then
          ( cd "$$SOURCE/trash" && find . -mindepth 3 -maxdepth 3 -type f -name '*.webp' | xargs -r stat -c '%s %n' ) > "$$dir/trash" 2>/dev/null
        else
          : > "$$dir/trash"
        fi
        ( cd "$$STORE" && find . -type f ! -name '*.part' | xargs -r stat -c '%s %n' ) > "$$dir/copy" 2>/dev/null
        awk -v LIVE="$$dir/live" -v TRASH="$$dir/trash" -v COPY="$$dir/copy" -v SRC="$$SOURCE" '
          FILENAME == LIVE { p = $$2; sub(/^\.\//, "", p); live[p] = $$1; next }
          FILENAME == TRASH { p = $$2; sub(/^\.\/[^\/]+\//, "", p); if (!(p in trash)) { trash[p] = $$1; where[p] = substr($$2, 3) } next }
          FILENAME == COPY { p = $$2; sub(/^\.\//, "", p); copy[p] = $$1; next }
          {
            line = $$0
            if (line in live) { size = live[line]; src = SRC "/" line }
            else if (line in trash) { size = trash[line]; src = SRC "/trash/" where[line] }
            else { print ((line in copy) ? "kept " : "missing ") line; next }
            if ((line in copy) && copy[line] == size) print "ok " line " " size
            else print "copy " line " " size " " src
          }
        ' "$$dir/live" "$$dir/trash" "$$dir/copy" "$$1"
        status=$$?
        rm -rf "$$dir"
        return $$status
      }

      # One backup ---------------------------------------------------------------

      # Set as the run goes, for the log step.
      OUTCOME=failed
      ERROR=""
      DUMP_BYTES=""
      COPIED=0

      run_backup() {
        RUN_ID=$$(tr -dc 'a-z0-9' </dev/urandom | head -c 8)
        START=$$(date -u +%s)
        NAME="raccoon-$$(date -u -d "@$$START" +%Y-%m-%d-%H%M%S)-$$RUN_ID"
        OUTCOME=failed
        ERROR=""
        DUMP_BYTES=""
        COPIED=0

        # 1. The log first, then what an interrupted run left. db/schema.sql is
        # the only definition of backup_runs, so a database the app has not set
        # up yet stops the run here, before anything is written.
        if ! exists=$$(sql -c "select to_regclass('public.backup_runs') is not null"); then
          complain "backup $$NAME: failed: the database did not answer"
          return 1
        fi
        if [ "$$exists" != t ]; then
          complain "$$NO_LOG"
          return 1
        fi
        # No other run is alive while the lock is held, so a row still "running"
        # belongs to a run that was stopped.
        if ! printf '%s\n' \
          "update backup_runs set outcome = 'failed', finished_at = now(), error = 'stopped before it finished' where outcome = 'running';" \
          "insert into backup_runs (id, started_at, outcome) values (:'id', to_timestamp(:'start'), 'running');" |
          sql -v id="$$RUN_ID" -v start="$$START"; then
          complain "backup $$NAME: failed: could not write to the backup log"
          return 1
        fi
        mkdir -p "$$STORE"
        rm -f "$$BACKUPS"/*.part
        find "$$STORE" -type f -name '*.part' -exec rm -f {} + 2>/dev/null
        for f in "$$BACKUPS"/raccoon-*.files; do [ -e "$$f" ] && [ ! -e "$${f%.files}.dump" ] && rm -f "$$f"; done
        for f in "$$BACKUPS"/raccoon-*.dump; do [ -e "$$f" ] && [ ! -e "$${f%.dump}.good" ] && rm -f "$$f" "$${f%.dump}.files"; done
        for f in "$$BACKUPS"/raccoon-*.good; do [ -e "$$f" ] && [ ! -e "$${f%.good}.dump" ] && rm -f "$$f" "$${f%.good}.files"; done

        backup_steps
        log_step
        case $$OUTCOME in
          good) say "backup $$NAME: good, $$DUMP_BYTES byte dump, $$COPIED images copied" ;;
          *) say "backup $$NAME: $$OUTCOME: $$ERROR" ;;
        esac
        [ "$$OUTCOME" = good ]
      }

      backup_steps() {
        part="$$BACKUPS/$$NAME.dump.part"
        list="$$BACKUPS/$$NAME.files"

        # 2. Space for the dump: the last good dump plus a quarter, or the
        # database's own size when that is larger or there is none, which a
        # compressed custom-format dump stays under.
        newest=$$(ls "$$BACKUPS"/raccoon-*.good 2>/dev/null | sort | tail -n 1)
        last=0
        [ -n "$$newest" ] && last=$$(field "$$newest" bytes)
        estimate=$$((last + last / 4))
        if ! db=$$(sql -c "select pg_database_size(current_database())"); then ERROR="the database did not answer"; return; fi
        [ "$$db" -gt "$$estimate" ] && estimate=$$db
        budget=$$(($$(free_bytes) - FLOOR))
        if [ "$$estimate" -gt "$$budget" ]; then
          ERROR="not enough space for the dump: about $$estimate bytes needed, $$budget free above the floor"
          return
        fi

        # 3. The dump, under a file size limit, writing straight to its file so
        # the archive stays seekable. A write past the budget kills pg_dump
        # (SIGXFSZ) or fails it (EFBIG), and its own exit status is the subshell's.
        # Then the whole archive is read back, every table's data and not only
        # the catalog, which pg_restore --list alone would read.
        limit=$${BACKUP_TEST_DUMP_LIMIT_BYTES:-$$budget}
        case $${BACKUP_TEST_DUMP:-} in
          kill) sh -c 'pg_dump --format=custom --exclude-table=backup_runs | head -c 4096 > "$$1"; kill -KILL $$$$' sh "$$part" ;;
          fail) sh -c 'printf PGDMP > "$$1"; exit 3' sh "$$part" ;;
          *) (ulimit -f "$$((limit / 512))" && exec pg_dump --format=custom --exclude-table=backup_runs --file="$$part") ;;
        esac
        status=$$?
        if [ "$$status" -ne 0 ]; then
          rm -f "$$part"
          ERROR="pg_dump failed with status $$status"
          return
        fi
        if ! pg_restore --file=/dev/null "$$part"; then
          rm -f "$$part"
          ERROR="the dump did not read back whole"
          return
        fi
        DUMP_BYTES=$$(size_of "$$part")

        # 4. What the dump names, written beside it before the rename, so a dump
        # under its final name always has its list.
        if ! list_dump "$$part" > "$$list.part"; then
          rm -f "$$part" "$$list.part"
          ERROR="the dump's image rows could not be listed"
          return
        fi
        mv "$$list.part" "$$list"
        test_pause listed
        mv "$$part" "$$BACKUPS/$$NAME.dump"
        count=$$(wc -l < "$$list" | tr -d ' ')

        # 5. Space for the images the copy lacks.
        steps=$$(mktemp)
        if ! plan "$$list" > "$$steps"; then
          rm -f "$$steps"
          OUTCOME=partial
          ERROR="the image volume could not be read"
          return
        fi
        need=$$(awk '$$1 == "copy" { n += $$3 } END { printf "%.0f\n", n }' "$$steps")
        if [ $$(($$(free_bytes) - need)) -lt "$$FLOOR" ]; then
          rm -f "$$steps"
          OUTCOME=partial
          ERROR="not enough space for the images: $$need bytes to copy"
          return
        fi

        # 6. The copy, each file through a .part checked by length, so a file
        # under its final name is always whole.
        failed=0
        done_n=0
        while read -r what path size src; do
          [ "$$what" = copy ] || continue
          dest="$$STORE/$$path"
          mkdir -p "$${dest%/*}"
          # Deleted since the plan was made: it waits in the trash.
          if [ ! -e "$$src" ]; then
            for t in "$$SOURCE"/trash/*/"$$path"; do [ -e "$$t" ] && src=$$t && break; done
          fi
          if cp "$$src" "$$dest.part" 2>/dev/null; then
            test_pause copying
            if [ "$$(size_of "$$dest.part")" = "$$size" ]; then
              mv "$$dest.part" "$$dest"
              COPIED=$$((COPIED + 1))
            else
              rm -f "$$dest.part"
              failed=$$((failed + 1))
            fi
          else
            rm -f "$$dest.part"
            failed=$$((failed + 1))
          fi
          done_n=$$((done_n + 1))
          if [ $$((done_n % 100)) -eq 0 ] && [ "$$(free_bytes)" -lt "$$FLOOR" ]; then
            rm -f "$$steps"
            OUTCOME=partial
            ERROR="the backups volume filled up during the copy"
            return
          fi
        done < "$$steps"
        rm -f "$$steps"

        # 7. The check, from a fresh look: every listed file in the copy at its
        # source's length, or in the copy under its final name once its source
        # left the trash.
        if ! short=$$(plan "$$list" | awk '$$1 == "copy" || $$1 == "missing" { n++ } END { printf "%.0f\n", n }'); then
          OUTCOME=partial
          ERROR="the image volume could not be read"
          return
        fi
        if [ "$$short" -ne 0 ]; then
          OUTCOME=partial
          ERROR="$$short of $$count listed images are not in the copy"
          [ "$$failed" -gt 0 ] && ERROR="$$ERROR ($$failed could not be read or copied whole)"
          return
        fi

        # 8. The completion record, last of all.
        {
          printf 'run=%s\n' "$$RUN_ID"
          printf 'started=%s\n' "$$START"
          printf 'dump=%s.dump\n' "$$NAME"
          printf 'bytes=%s\n' "$$DUMP_BYTES"
          printf 'files=%s.files\n' "$$NAME"
          printf 'count=%s\n' "$$count"
          printf 'copied=%s\n' "$$COPIED"
          printf 'finished=%s\n' "$$(date -u +%s)"
        } > "$$BACKUPS/$$NAME.good.part" && mv "$$BACKUPS/$$NAME.good.part" "$$BACKUPS/$$NAME.good"
        if [ ! -e "$$BACKUPS/$$NAME.good" ]; then
          ERROR="the completion record could not be written"
          return
        fi
        OUTCOME=good

        # 9. Retention, from the completion records only.
        retain
      }

      # Keeps this run, the 6 other newest, and the newest of each of the last 4
      # weeks, then deletes every other dump, list and record, and every copied
      # image no kept list names. A run therefore always survives its own
      # retention, and the copy holds exactly the images the kept dumps need.
      retain() {
        now=$$(date -u +%s)
        for r in "$$BACKUPS"/raccoon-*.good; do
          [ -e "$$r" ] || continue
          printf '%s %s\n' "$$(field "$$r" started)" "$$(basename "$$r" .good)"
        done | sort -rn | awk -v now="$$now" -v current="$$NAME" -v daily="$$DAILY" -v weekly="$$WEEKLY" '
          {
            keep = ($$2 == current)
            if (!keep && others < daily - 1) { keep = 1; others++ }
            week = int((now - $$1) / 604800)
            if (week >= 0 && week < weekly && !(week in seen)) { seen[week] = 1; keep = 1 }
            print (keep ? "keep " : "drop ") $$2
          }
        ' > /tmp/retention
        while read -r verdict name; do
          [ "$$verdict" = drop ] && rm -f "$$BACKUPS/$$name.good" "$$BACKUPS/$$name.dump" "$$BACKUPS/$$name.files"
        done < /tmp/retention
        awk '$$1 == "keep" { print $$2 }' /tmp/retention | while read -r name; do cat "$$BACKUPS/$$name.files"; done | sort -u > /tmp/kept
        (cd "$$STORE" && find . -type f | sed 's|^\./||' | sort) > /tmp/held
        comm -23 /tmp/held /tmp/kept | while read -r path; do rm -f "$$STORE/$$path"; done
        find "$$STORE" -mindepth 1 -type d -empty -delete 2>/dev/null
        rm -f /tmp/retention /tmp/kept /tmp/held
      }

      # 10. The log: every completion record has a row marked good, a row marked
      # good without a record is gone, this run's row gets its outcome, and rows
      # older than 90 days go. The rows are only a log, rebuilt from the records.
      log_step() {
        values=""
        ids=""
        for r in "$$BACKUPS"/raccoon-*.good; do
          [ -e "$$r" ] || continue
          name=$$(basename "$$r" .good)
          run=$$(field "$$r" run)
          started=$$(field "$$r" started)
          finished=$$(field "$$r" finished)
          bytes=$$(field "$$r" bytes)
          copied=$$(field "$$r" copied)
          # Every value is checked before it becomes SQL text.
          printf '%s\n' "$$name" | grep -q "$$NAME_PATTERN" || continue
          printf '%s\n' "$$run" | grep -q "^$$RUN_ID_PATTERN\$$" || continue
          for n in "$$started" "$$finished" "$$bytes" "$${copied:-0}"; do
            case $$n in '' | *[!0-9]*) continue 2 ;; esac
          done
          values="$$values$${values:+,}('$$run', to_timestamp($$started), to_timestamp($$finished), 'good', '$$name.dump', $$bytes, $${copied:-0})"
          ids="$$ids$${ids:+,}'$$run'"
        done
        {
          if [ -n "$$values" ]; then
            printf '%s\n' "insert into backup_runs (id, started_at, finished_at, outcome, dump, dump_bytes, images_copied) values $$values
              on conflict (id) do update set outcome = 'good', finished_at = excluded.finished_at, dump = excluded.dump,
                dump_bytes = excluded.dump_bytes, images_copied = excluded.images_copied, error = null
              where backup_runs.outcome <> 'good';"
            printf '%s\n' "update backup_runs set outcome = 'gone' where outcome = 'good' and id not in ($$ids);"
          else
            printf '%s\n' "update backup_runs set outcome = 'gone' where outcome = 'good';"
          fi
          printf '%s\n' "update backup_runs set outcome = :'outcome', finished_at = now(), dump = nullif(:'dump', ''),
            dump_bytes = nullif(:'bytes', '')::bigint, images_copied = :'copied'::int, error = nullif(:'error', '')
            where id = :'id';"
          printf '%s\n' "delete from backup_runs where started_at < now() - make_interval(days => $$LOG_DAYS);"
        } | sql -v id="$$RUN_ID" -v outcome="$$OUTCOME" -v dump="$${DUMP_BYTES:+$$NAME.dump}" -v bytes="$$DUMP_BYTES" \
          -v copied="$$COPIED" -v error="$$ERROR" || complain "backup $$NAME: the backup log could not be updated"
      }

      # Restore ------------------------------------------------------------------

      restore() {
        name=$${1:-}
        name=$${name##*/}
        name=$${name%.dump}
        # A brand new volume first mounted here, where the image has no
        # /data/assets, belongs to root, and every later upload into a folder made
        # here would fail. The app's image makes it the app's.
        if [ "$$(stat -c %u "$$TARGET" 2>/dev/null)" != 1000 ]; then
          complain "The image volume is not the app's yet. Start the stack once with docker compose up -d, then stop raccoon and restore."
          return 2
        fi
        if [ ! -e "$$LOCK" ]; then
          complain "The backup service has not started yet. Start the stack once, then restore."
          return 2
        fi
        if ! printf '%s\n' "$$name" | grep -q "$$NAME_PATTERN"; then
          complain "Name the backup to restore, for example: backup.sh restore raccoon-2026-10-14-040000-abcd1234"
          list_good >&2
          return 2
        fi
        if ! take_lock; then
          complain "A backup is running. Wait for it to finish, then restore."
          return 1
        fi
        restore_locked "$$name"
        status=$$?
        release_lock
        return $$status
      }

      list_good() {
        found=0
        for r in "$$BACKUPS"/raccoon-*.good; do
          [ -e "$$r" ] || continue
          [ $$found -eq 0 ] && say "Good backups, oldest first:"
          found=1
          say "  $$(basename "$$r" .good)"
        done
        [ $$found -eq 0 ] && say "There are no good backups."
      }

      restore_locked() {
        name=$$1
        dump="$$BACKUPS/$$name.dump"
        if [ ! -f "$$BACKUPS/$$name.good" ] || [ ! -f "$$dump" ] || [ ! -f "$$BACKUPS/$$name.files" ]; then
          complain "$$name is not a good backup: it has no completion record."
          list_good >&2
          return 2
        fi
        # Every image the dump names must be at hand before the database changes,
        # or the rooms would come back with broken pictures.
        listed=$$(wc -l < "$$BACKUPS/$$name.files" | tr -d ' ')
        lost=$$(unrestorable "$$BACKUPS/$$name.files")
        if [ "$$lost" -ne 0 ]; then
          complain "$$lost of the $$listed images $$name lists are missing from the backups volume, so it cannot be restored whole. Nothing was restored. Choose another backup."
          list_good >&2
          return 1
        fi
        # The app holds rooms in memory and would write them back over the
        # restored rows, so nothing may be connected. pg_isready's brief
        # connections are the reason for the second look.
        for try in 1 2 3; do
          others=$$(sql -c "select count(*) from pg_stat_activity where datname = current_database() and pid <> pg_backend_pid() and backend_type = 'client backend'") || {
            complain "The database did not answer."
            return 1
          }
          [ "$$others" = 0 ] && break
          [ "$$try" = 3 ] && {
            complain "Something is still connected to the database. Stop raccoon first (docker compose stop raccoon, with -f docker-compose.server.yml for the server stack), then restore again."
            return 1
          }
          sleep 1
        done
        say "Restoring the database from $$name..."
        if ! pg_restore --clean --if-exists --no-owner --single-transaction --exit-on-error --dbname="$$PGDATABASE" "$$dump"; then
          complain "The database restore failed, and was rolled back. Nothing changed."
          return 1
        fi
        test_pause restoring
        say "Copying the images..."
        # Never overwriting: a file under its final name on the volume is whole,
        # and the copy below makes it so through a .restoring file checked by length.
        find "$$TARGET" -mindepth 2 -maxdepth 2 -type f -name '*.restoring' -exec rm -f {} + 2>/dev/null
        copied=0
        failed=0
        for src in $$(cd "$$STORE" && find . -mindepth 2 -maxdepth 2 -type f -name '*.webp' | sed 's|^\./||'); do
          dest="$$TARGET/$$src"
          [ -e "$$dest" ] && continue
          mkdir -p "$${dest%/*}"
          want=$$(file_size "$$STORE/$$src") || want=""
          if [ -n "$$want" ] && cp "$$STORE/$$src" "$$dest.restoring" && [ "$$(file_size "$$dest.restoring")" = "$$want" ]; then
            mv "$$dest.restoring" "$$dest"
            copied=$$((copied + 1))
          else
            rm -f "$$dest.restoring"
            failed=$$((failed + 1))
          fi
        done
        # Each listed image must now be a regular file on the image volume, at its
        # copy's length where the backups volume holds one.
        missing=0
        while IFS= read -r path; do
          have=$$(file_size "$$TARGET/$$path") || {
            missing=$$((missing + 1))
            continue
          }
          want=$$(file_size "$$STORE/$$path") || continue
          [ "$$have" = "$$want" ] || missing=$$((missing + 1))
        done < "$$BACKUPS/$$name.files"
        if [ "$$missing" -ne 0 ]; then
          complain "The database is restored, but $$missing of its images are not on the image volume ($$failed failed to copy)."
          return 1
        fi
        say "Restored $$name, with $$copied images copied. Now start raccoon, wait until it is healthy, then run backup.sh once."
        return 0
      }

      # The nightly loop -----------------------------------------------------------

      # Minutes into the local day, with leading zeros taken off so the shell
      # never reads 08 as octal.
      minutes_of() {
        h=$${1%%:*}
        m=$${1#*:}
        h=$${h#0}
        m=$${m#0}
        printf '%s\n' "$$((h * 60 + m))"
      }

      # The loop's variables are its own: every function here shares the shell's
      # one set of names, and a run's own must never move the loop's day.
      schedule() {
        BACKUP_TIME=$${BACKUP_AT:-04:00}
        if ! printf '%s\n' "$$BACKUP_TIME" | grep -Eq '^([01][0-9]|2[0-3]):[0-5][0-9]$$'; then
          complain "BACKUP_AT must be HH:MM, such as 04:00, not $$BACKUP_TIME"
          exit 1
        fi
        DUE_S=$$(($$(minutes_of "$$BACKUP_TIME") * 60))
        ensure_lock
        say "Backups run every day at $$BACKUP_TIME ($$(date +%Z))."
        # Started after today's time, the first run is tomorrow's.
        LAST_DAY=""
        [ $$(($$(minutes_of "$$(date +%H:%M)") * 60)) -ge "$$DUE_S" ] && LAST_DAY=$$(date +%Y-%m-%d)
        while :; do
          TODAY=$$(date +%Y-%m-%d)
          CLOCK=$$(date +%H:%M:%S)
          SECOND=$${CLOCK##*:}
          NOW_S=$$(($$(minutes_of "$${CLOCK%:*}") * 60 + $${SECOND#0}))
          if [ "$$LAST_DAY" != "$$TODAY" ] && [ "$$NOW_S" -ge "$$DUE_S" ]; then
            LAST_DAY=$$TODAY
            if take_lock; then
              run_backup
              release_lock
            else
              say "Skipped tonight's backup: a backup or restore is running."
            fi
            continue
          fi
          SLEEP_S=$$((DUE_S - NOW_S))
          [ "$$SLEEP_S" -le 0 ] && SLEEP_S=$$((SLEEP_S + 86400))
          # At most an hour at a time, so a clock change never skips a night.
          [ "$$SLEEP_S" -gt 3600 ] && SLEEP_S=3600
          sleep "$$SLEEP_S"
        done
      }

      case $${1:-} in
        "")
          schedule
          ;;
        once)
          ensure_lock
          if ! take_lock; then
            say "A backup is running."
            exit 1
          fi
          run_backup
          status=$$?
          release_lock
          exit $$status
          ;;
        restore)
          restore "$${2:-}"
          exit $$?
          ;;
        *)
          complain "Usage: backup.sh [once | restore <dump name>]"
          exit 2
          ;;
      esac

  # The https profile's Caddy.
  caddyfile:
    content: |
      # The https profile's front end (selfhost/compose.yml). SITE_ADDRESS is
      # PUBLIC_ORIGIN unless .env sets it, and Caddy gets and renews the
      # certificate for its host on its own. reverse_proxy passes WebSockets
      # through and keeps the browser's Origin and Host headers.
      {$$SITE_ADDRESS} {
      	reverse_proxy raccoon:3000 {
      		# With TRUST_CF_CONNECTING_IP=1 in .env, every per-address limit
      		# in the app keys on this header. Overwriting it with the address
      		# that connected means no client can make one up.
      		header_up CF-Connecting-IP {remote_host}
      	}
      }
