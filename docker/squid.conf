# The app's only way out (design sections 10.6 and 15.3).
#
# The app container sits on internal-only docker networks, so it has no route
# to the internet, to the host, or to anything else running on it. This proxy
# is the single exception. It listens on two ports,
# each with its own rules, because the app makes two kinds of outbound call
# with very different trust:
#
#   3128 "strict"  serpapi.com (image search, its account API and its hosted
#                  thumbnails), api.openverse.org (the second image search
#                  and its access token) and, when Turnstile is configured,
#                  challenges.cloudflare.com. Nothing else.
#   3129 "public"  any host on port 443, for importing an image from a URL a
#                  member pasted. Never a private, loopback, link-local,
#                  CGNAT, multicast or reserved address.
#
# The app picks the port per call with an explicit undici ProxyAgent
# (server/assets/egress.ts), never through HTTPS_PROXY, so a call site shows
# which way it goes out and nothing can silently go direct.

http_port 3128 name=strict
http_port 3129 name=public

acl strict_port myportname strict
acl public_port myportname public

# Exact names, no leading dot. A leading dot would also match every
# subdomain, which is a wider hole than this needs.
acl strict_hosts dstdomain serpapi.com api.openverse.org challenges.cloudflare.com

# Against a name that resolves inward, on both ports. The networks around
# this proxy already keep the app from addressing the host, but a hostname is
# resolved here, so without these lines anybody who could point a DNS record
# at 172.17.0.1 would have a route to the host through this proxy. Squid
# resolves before it applies `dst`, so this also catches a rebind. A record
# with a zero TTL could in principle resolve differently between this check
# and the connect, which is why the host firewall rules in design section
# 15.3 back it up.
#
# The IPv6 list has no ::ffff:0:0/96 (IPv4-mapped) entry. Squid stores every
# IPv4 address in that mapped form, so the entry matched every IPv4
# destination and denied all traffic (tested against the pinned image). A
# mapped address such as ::ffff:10.0.0.1 is compared as the IPv4 it carries,
# so the IPv4 list above already refuses the private ones (also tested).
acl to_private dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl to_private6 dst ::1 ::/128 fc00::/7 fe80::/10 64:ff9b::/96 2002::/16

acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny to_private
http_access deny to_private6
http_access deny CONNECT !SSL_ports
# Plain http is not allowed out at all. Every call the app makes is https,
# tunnelled with CONNECT, and the app checks the certificate itself.
http_access deny !CONNECT
http_access allow strict_port strict_hosts
http_access allow public_port
http_access deny all

# A tunnel, not a cache. There is no cache_dir, so nothing is written to disk
# and the container can stay read-only.
cache deny all

# Resolve through Cloudflare rather than the host's resolver. The host
# resolver would be reached across the docker gateway, which is the thing
# this whole arrangement is built to avoid, and pointing at it would also
# make name resolution break the moment a firewall rule blocks that path.
dns_nameservers 1.1.1.1 1.0.0.1

# No ICMP pinger. It needs NET_RAW, which the compose file drops, so with it
# on squid logs "FATAL: Unable to open any ICMP sockets" at every start while
# carrying on fine. A FATAL that is not fatal teaches people to skim past the
# log. This proxy picks no route by latency, so the pinger has no job here.
pinger_enable off

# Logs go to files that the image's entrypoint tails to the container's
# output, so `docker compose logs` is the whole story. Every allowed CONNECT
# is recorded with its destination, which makes "did this container talk to
# anything it should not have" an answerable question. No credential passes
# through here in the clear: a CONNECT carries the hostname only, and the
# SerpApi key and the Openverse client secret and token are inside the TLS
# session this proxy cannot see into.
# Not /dev/stdout: squid drops to the unprivileged `proxy` user before it
# opens its logs, cannot open /dev/stdout as that user, and exits. The
# directory is a tmpfs in the compose file, so nothing accumulates on disk.
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
cache_store_log none
# No pid file, so nothing needs /run to be writable either.
pid_filename none

# Say nothing about what is behind this.
via off
forwarded_for delete
httpd_suppress_version_string on
