<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fontconfig for e2e runs on Linux (.github/workflows/ci.yml installs it as
  the user's fonts.conf, beside the fonts-roboto package).

  The app's font stack starts with system-ui, and Android draws that in
  Roboto. Chrome on Linux takes system-ui from fontconfig's default sans
  font, which is DejaVu Sans on Ubuntu, so the Roboto later in the stack is
  never reached. Preferring Roboto for sans-serif, which fontconfig's sans
  default resolves through, makes system-ui Roboto, as on an Android phone.

  It is a fallback for the system stack only. Once the app serves its own
  font, the page names it first and this file stops mattering.
-->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
</fontconfig>
