<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fontconfig for e2e runs on Linux (.github/workflows/ci.yml installs it as
  the user's fonts.conf, beside the fonts-roboto package).

  The app draws in Inter, which it serves itself, and its font stack
  continues with system-ui, which Android draws in Roboto. That fallback
  draws before Inter loads and for any character Inter's subset lacks.
  Chrome on Linux takes system-ui from fontconfig's default sans font,
  which is DejaVu Sans on Ubuntu, so the Roboto later in the stack is never
  reached. Preferring Roboto for sans-serif, which fontconfig's sans
  default resolves through, makes system-ui Roboto, as on an Android phone.

  Text drawn in Inter does not depend on this file. Only the fallback does.
-->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
</fontconfig>
