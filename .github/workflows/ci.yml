# Every check on pushes to main or ci/ branches, and on pull requests to
# main: typecheck, integration tests, unit tests, and e2e files in 14 shards.
# That is 17 jobs with the build. One run peaks at 16 Linux jobs of the
# account's 20, so a run that overlaps it queues part of its shards: a single
# run's speed was chosen over two runs at full speed at once.
#
# A push to a ci/ branch on main's tip that changes only docs
# (scripts/ci-scope.ts) runs the typecheck, the unit tests, the build and
# e2e/guide.e2e.ts, in one shard, and skips the rest, so the run still ends
# green. Anything else, main and a branch behind main included, runs
# everything.
#
# The e2e shards run on Ubuntu, since macOS runners are far slower and the
# account runs up to 20 Linux jobs at a time. The app draws its
# text in Inter, which it serves itself, so a page lays out on Linux as on
# any device. Each shard still installs Roboto, and e2e/fonts.conf makes it
# Chrome's system font: the fallback font, as on Android, for the moment
# before Inter loads and for the characters its subset lacks. A file that
# fails on Linux from font metrics alone goes in e2e/macos-only.json, and a
# macOS job runs those files only while that list is not empty.
#
# The client is built once, since the bundle is the same bytes on every OS,
# and each shard downloads it. scripts/e2e-shard.ts decides which files each
# shard runs, and README.md ("Continuous integration") has the rest.
#
# It needs no secrets and deploys nothing.
name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a ci/ branch replaces that branch's run in progress. On
# main every push is tested: each run there has a group of its own, since a
# shared group, even without cancel-in-progress, still cancels a run that
# waits in it when a third push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The Node of the production image (the Dockerfile's NODE_IMAGE). pnpm
  # comes from package.json's packageManager field.
  NODE_VERSION: 24.21.0

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      macos-files: ${{ steps.macos.outputs.files }}
      docs-only: ${{ steps.scope.outputs.docs-only }}
      shards: ${{ steps.scope.outputs.shards }}
    steps:
      # The whole history without file contents, so the scope step finds the
      # merge base with main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Count the files that run only on macOS
        id: macos
        run: echo "files=$(jq '.files | length' e2e/macos-only.json)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: What the push changes
        id: scope
        run: node scripts/ci-scope.ts
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # three.js stays in the dice chunk alone, which nothing every member loads imports (scripts/three-chunk.ts).
      - name: Check the dice chunk
        run: node scripts/three-chunk.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  # The typecheck and the integration tests share a job: together they end
  # well inside one e2e shard, and only the integration tests need the
  # database. It waits for the build's scope, since a docs-only push skips
  # the integration tests, and runs even when the build failed, when it
  # checks everything. The unit tests have a job of their own, which needs
  # no database.
  typecheck-int:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # The development database of docker-compose.yml: postgres 17 on Alpine,
      # by the digest docker-compose.yml pins for its backup image, with the
      # same user, password and database. The server applies db/schema.sql
      # itself on its first connection.
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: raccoon
          POSTGRES_PASSWORD: raccoon
          POSTGRES_DB: raccoon
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U raccoon -d raccoon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://raccoon:raccoon@localhost:5434/raccoon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - id: install
        run: pnpm install --frozen-lockfile
      # Each check runs even when an earlier one failed, so one push reports both.
      - name: Typecheck
        run: pnpm -s typecheck
      - name: Integration tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.build.outputs.docs-only != 'true' }}
        run: pnpm -s test:int

  # About 5 minutes alone, which ends before the e2e shards do, so the unit
  # tests are not split with --test-shard.
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm -s test

  e2e:
    needs: build
    runs-on: ubuntu-24.04
    # 14 shards (scripts/ci-scope.ts SHARDS) of about 8 minutes each,
    # balanced by scripts/e2e-shard.ts from e2e/durations.json, which holds
    # the seconds a file took in CI.
    # The shard's deadline keeps it inside this limit even when a file hangs.
    # A docs-only push gets one shard, which runs the guide's file alone.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    services:
      # The same database as the typecheck-int job's, one per shard.
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: raccoon
          POSTGRES_PASSWORD: raccoon
          POSTGRES_DB: raccoon
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U raccoon -d raccoon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://raccoon:raccoon@localhost:5434/raccoon
      E2E_SCREENSHOT_DIR: test-results/e2e-screenshots
    steps:
      # The shard reports by this deadline, 5 minutes inside the job's
      # limit: for the service container, which starts before this step,
      # and for keeping the logs after the shard.
      - name: Deadline for the shard
        run: echo "E2E_DEADLINE=$(( $(date +%s) + (45 - 5) * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # The fallback font behind Inter: Ubuntu 24.04's Roboto, the fonts of
      # fonts-roboto-unhinted 2:0~20170802-3 (fonts-roboto only depends on
      # it), from the archive's pool by its checksum and into the user's
      # fonts. apt's index update took most of the step's time before. The
      # runner's own mirror answers in a tenth of a second, but about one
      # fetch in ten crawls for 30 s, so it gets 5 s before the main archive,
      # which takes 1 to 2 s, is asked. The last line fails the step unless
      # fontconfig now answers Roboto.
      - name: Roboto as the system font
        run: |
          deb=fonts-roboto-unhinted_0~20170802-3_all.deb
          pool=ubuntu/pool/universe/f/fonts-roboto
          curl -fsS --max-time 5 -o "$RUNNER_TEMP/$deb" "http://azure.archive.ubuntu.com/$pool/$deb" || curl -fsS --retry 3 --max-time 60 -o "$RUNNER_TEMP/$deb" "http://archive.ubuntu.com/$pool/$deb"
          echo "21852f3ef1a13ae4cb9cfabd89a3cd0b3979f189bd14801d3010e8a7da3bff0e  $RUNNER_TEMP/$deb" | sha256sum -c --quiet -
          dpkg-deb -x "$RUNNER_TEMP/$deb" "$RUNNER_TEMP/roboto"
          mkdir -p ~/.local/share/fonts ~/.config/fontconfig
          cp -r "$RUNNER_TEMP/roboto/usr/share/fonts/truetype/roboto" ~/.local/share/fonts/
          cp e2e/fonts.conf ~/.config/fontconfig/fonts.conf
          fc-cache ~/.local/share/fonts
          test "$(fc-match --format='%{family}' sans-serif)" = Roboto
      # The harness launches Chrome with channel "chrome", which is the
      # runner image's Google Chrome stable. The image sets its version.
      - run: google-chrome --version
      - name: e2e shard ${{ matrix.shard }}
        id: shard
        run: node scripts/e2e-shard.ts ${{ matrix.shard }} ${{ strategy.job-total }} ${{ needs.build.outputs.docs-only == 'true' && '--only guide' || '' }} --deadline "$E2E_DEADLINE"
      # A shard that failed, was cancelled or passed only through a rerun
      # keeps its logs and screenshots for two weeks.
      - name: Keep logs and screenshots
        if: ${{ always() && (steps.shard.outcome != 'success' || steps.shard.outputs.reran == 'true') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The files of e2e/macos-only.json, on a Mac. Skipped while the list is
  # empty, and for a docs-only push.
  e2e-macos:
    needs: build
    if: ${{ needs.build.outputs.macos-files != '0' && needs.build.outputs.docs-only != 'true' }}
    # Apple silicon, named rather than macos-latest so the fonts change
    # only when this line does.
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DATABASE_URL: postgres://raccoon:raccoon@localhost:5434/raccoon
      E2E_SCREENSHOT_DIR: test-results/e2e-screenshots
    steps:
      # As in the e2e job: 5 minutes inside the job's limit.
      - name: Deadline for the shard
        run: echo "E2E_DEADLINE=$(( $(date +%s) + (75 - 5) * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # The macOS images have no Docker and no PostgreSQL, so it comes from
      # Homebrew, at the major version of the service container. It is set
      # up as that image sets itself up: user and password raccoon, passwords
      # checked on TCP, and a database named raccoon. The database is created
      # over TCP, the way the server connects, so a wrong password setup
      # fails here rather than in the first e2e file.
      - name: Start PostgreSQL 17
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
          PGPASSWORD: raccoon
        run: |
          brew install postgresql@17
          bin="$(brew --prefix postgresql@17)/bin"
          data="$RUNNER_TEMP/pgdata"
          printf raccoon > "$RUNNER_TEMP/pgpass"
          mkdir -p test-results
          "$bin/initdb" --pgdata="$data" --username=raccoon --pwfile="$RUNNER_TEMP/pgpass" \
            --auth-local=trust --auth-host=scram-sha-256 --encoding=UTF8 --locale=en_US.UTF-8
          "$bin/pg_ctl" --pgdata="$data" --log=test-results/postgres.log --options="-p 5434" --wait start
          "$bin/createdb" --host=localhost --port=5434 --username=raccoon raccoon
      - name: e2e on macOS
        id: shard
        run: node scripts/e2e-shard.ts 1 1 --macos-only --deadline "$E2E_DEADLINE"
      - name: Keep logs and screenshots
        if: ${{ always() && (steps.shard.outcome != 'success' || steps.shard.outputs.reran == 'true') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-macos
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
