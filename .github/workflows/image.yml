# Publishes the app image to Docker Hub on a version tag, for linux/amd64 and
# linux/arm64, as X.Y.Z, X.Y and latest (README.md, "Releasing"). This
# workflow is the only way the image is ever built for or pushed to Docker
# Hub.
#
# Every run checks the version, builds the image natively on arm64, and
# brings the amd64 image up with selfhost/compose.yml (selfhost/smoke-test.sh).
# A tag run also checks that the tag is `v` plus package.json's version, on a
# commit in main's history, and that ci.yml passed on that exact commit. Its
# publish job then runs in the `dockerhub` environment, which holds the Docker
# Hub secrets, admits only `v*` tags and waits for one approval. That job
# builds amd64, smoke-tests it, and pushes amd64 and arm64 (emulated) from
# the same builder and cache, so the amd64 image pushed is the one tested:
# it checks that their config digests match before it tags anything. It
# never rebuilds or replaces a version Docker Hub already has. A run that
# stopped after pushing X.Y.Z can be run again to sign and finish tagging.
# X.Y and latest move only forward, by what Docker Hub holds
# (scripts/release-tags.ts).
# After publication succeeds, separate jobs generate notes with read-only
# access and create the GitHub Release without changing an existing one.
#
# A run on a ci/ branch that changes the image's own files, and a run
# started by hand, do the checks and the smoke test, and never push. A change
# to the app's code alone (server/, shared/, client/, db/, public/) does not
# start a branch run, so the image first meets such a change in the next
# release's run, which fails before it pushes anything if the image is
# broken.
#
# Only actions/checkout, pinned as in ci.yml, runs in the publish job that
# holds the Docker Hub token. Cosign comes from a checksum-pinned download
# in a run step and uses Docker's login file after the token is unset.
name: Image

on:
  push:
    tags: ["v*"]
    branches: ["ci/**"]
    # Branch pushes only. A tag push always runs, since GitHub does not
    # apply path filters to tags.
    paths:
      - Dockerfile
      - .dockerignore
      - selfhost/**
      - docker/**
      - docker-compose.server.yml
      - .github/workflows/image.yml
      - scripts/**
      - package.json
      - pnpm-lock.yaml
      # The Docker Hub overview, which dockerhub-description.yml sends by
      # hand, is not part of the image.
      - "!selfhost/DOCKERHUB.md"
      - "!selfhost/DOCKERHUB-short.txt"
  workflow_dispatch:

permissions:
  contents: read

# No run in progress is cancelled: a release half pushed is worse than one
# that waits. Every release shares one group, so two never publish at once,
# and a branch has a group of its own. GitHub keeps only one run waiting in a
# group, though: a release waiting behind another is cancelled when a third
# arrives, so push one release tag at a time (README.md, "Releasing").
concurrency:
  group: ${{ github.ref_type == 'tag' && 'image-publish' || format('image-{0}', github.ref) }}
  cancel-in-progress: false

env:
  # moby/buildkit v0.33.1, by digest, so the builder that makes a release is
  # the one that was reviewed. Refresh deliberately with
  # `docker buildx imagetools inspect moby/buildkit:buildx-stable-1`.
  BUILDKIT_IMAGE: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
  # The SBOM scanner, pinned the same way. Refresh with
  # `docker buildx imagetools inspect docker/buildkit-syft-scanner:stable-1`.
  SBOM_SCANNER: docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      sha: ${{ steps.version.outputs.sha }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      # The whole history without file contents, so origin/main is there to
      # check the tag against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: The version, and for a tag, the tag and main
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version package.json)
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json's version is '$version', not X.Y.Z."
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          publish=false
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::The tag is $REF_NAME, but package.json's version is $version. Tag the commit that sets it as v$version."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "::error::$REF_NAME points at $sha, which is not in main's history. Tag a commit on main."
              exit 1
            fi
            publish=true
          fi
          {
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "sha=$sha"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version at $sha. Publish: $publish."
      # In the production image's own Node, so it needs no install: the
      # generator uses nothing but Node's built-in modules.
      - name: selfhost/ is what its generator makes
        run: |
          node_image=$(sed -n 's/^ARG NODE_IMAGE=//p' Dockerfile)
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" --workdir /repo "$node_image" \
            node scripts/selfhost-compose.ts --check

  # The arm64 build on a native runner, as a check before anything is
  # pushed. It keeps nothing: the arm64 image that ships is built in the
  # publish job, from the same cache as the amd64 one.
  build-arm64:
    needs: check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A buildx builder
        run: docker buildx create --name raccoon --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --bootstrap --use
      - name: Build for linux/arm64
        env:
          VERSION: ${{ needs.check.outputs.version }}
          REVISION: ${{ needs.check.outputs.sha }}
        run: |
          docker buildx build --platform linux/arm64 \
            --build-arg "VERSION=$VERSION" --build-arg "REVISION=$REVISION" --build-arg "SOURCE_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --load --tag raccoon-vtt:arm64 .
      # The two native modules, which pnpm installs per CPU, load and work.
      - name: sharp and argon2 run on arm64
        run: |
          docker run --rm --read-only --network none raccoon-vtt:arm64 node --input-type=module -e "
            const sharp = (await import('sharp')).default;
            const png = await sharp({ create: { width: 2, height: 2, channels: 3, background: '#808080' } }).png().toBuffer();
            const { hash, verify } = await import('@node-rs/argon2');
            if (!(await verify(await hash('raccoon'), 'raccoon'))) throw new Error('argon2 failed');
            console.log('sharp made a ' + png.length + ' byte PNG, and argon2 hashed and verified, on ' + process.arch);
          "

  # The smoke test of a run that does not publish. A tag run does the same
  # inside its publish job, on the image it then pushes.
  smoke:
    needs: check
    if: needs.check.outputs.publish != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A buildx builder
        run: docker buildx create --name raccoon --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --bootstrap --use
      - name: Build for linux/amd64
        env:
          VERSION: ${{ needs.check.outputs.version }}
          REVISION: ${{ needs.check.outputs.sha }}
        run: |
          docker buildx build --platform linux/amd64 \
            --build-arg "VERSION=$VERSION" --build-arg "REVISION=$REVISION" --build-arg "SOURCE_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --load --tag raccoon-vtt:smoke .
          docker image inspect raccoon-vtt:smoke --format '{{json .Config.Labels}}' | jq .
      - name: Smoke test
        run: sh selfhost/smoke-test.sh raccoon-vtt:smoke

  # Publishing follows the deploy rule: green CI on the exact commit.
  ci-green:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: ci.yml passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --event push --status success --json databaseId --jq length)
          if [ "$runs" -eq 0 ]; then
            echo "::error::ci.yml has no successful run on $SHA. Wait for CI to pass on this commit, then re-run this workflow."
            exit 1
          fi
          echo "ci.yml passed on $SHA."

  # The one job that sees the Docker Hub secrets, and the one approval.
  #
  # Docker Hub's own state decides what it does, read inside the release
  # slot. X.Y.Z not there: build, smoke-test, push and tag. X.Y.Z there from
  # this same commit: a run before this one pushed it and stopped before the
  # floating tags, so this one signs and finishes tagging. X.Y.Z there from
  # anything else: refused, since a published version is never rebuilt or replaced.
  publish:
    needs: [check, build-arm64, ci-green]
    if: needs.check.outputs.publish == 'true'
    environment: dockerhub
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      MINOR: ${{ needs.check.outputs.minor }}
      REVISION: ${{ needs.check.outputs.sha }}
      # The username is an account name, not a credential. Only the steps
      # that log in see the token.
      IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/raccoon-vtt
    steps:
      - name: The Docker Hub secrets are set
        env:
          HAVE_USERNAME: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          HAVE_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          missing=""
          [ "$HAVE_USERNAME" = true ] || missing="$missing DOCKERHUB_USERNAME"
          [ "$HAVE_TOKEN" = true ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::The dockerhub environment is missing the secrets:$missing."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One source for the image's name: the one hosts pull, from the
      # generator's IMAGE through selfhost/compose.yml.
      - name: The repository pushed to is the one hosts pull
        run: |
          pulled=$(sed -n 's/^ *image: ${RACCOON_IMAGE:-\([^}]*\)}:.*/\1/p' selfhost/compose.yml)
          if [ "$pulled" != "$IMAGE" ]; then
            echo "::error::selfhost/compose.yml pulls '$pulled', but this job would push to '$IMAGE'. Change IMAGE in scripts/selfhost-compose.ts, or the dockerhub environment's namespace."
            exit 1
          fi
      # Every login lives inside one step: the token reaches docker login on
      # stdin, never on a command line, and the trap logs out however the
      # step ends. Only "not found" counts as absent. Any other answer stops
      # the job, which is why README.md's Releasing asks for the repository
      # to exist, public, before the first tag.
      - name: What Docker Hub holds for this version
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          trap 'docker logout docker.io' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          # A value as one line of a workflow command: % and line breaks escaped, so text from Docker Hub cannot start a command of its own.
          plain() { local s=${1//"%"/%25}; s=${s//$'\r'/%0D}; printf '%s' "${s//$'\n'/%0A}"; }
          if ! found=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Image}}' 2>&1); then
            case $found in
              *"not found"*) echo "MODE=build" >> "$GITHUB_ENV"; echo "$VERSION is not on Docker Hub yet: building it."; exit 0 ;;
              *) echo "::error::Could not tell whether $(plain "$VERSION") is on Docker Hub: $(plain "$found")"; exit 1 ;;
            esac
          fi
          label() { jq -r --arg l "$1" '."linux/amd64".config.Labels[$l] // empty' <<< "$found"; }
          platforms=$(jq -r 'keys | map(select(startswith("linux/"))) | sort | join(" ")' <<< "$found")
          source_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if [ "$(label org.opencontainers.image.revision)" != "$REVISION" ] || [ "$(label org.opencontainers.image.version)" != "$VERSION" ] \
            || [ "$(label org.opencontainers.image.source)" != "$source_url" ] || [ "$platforms" != "linux/amd64 linux/arm64" ]; then
            echo "::error::$(plain "$VERSION") is already on Docker Hub, and not as this run would push it: revision '$(plain "$(label org.opencontainers.image.revision)")' (this run's '$(plain "$REVISION")'), version '$(plain "$(label org.opencontainers.image.version)")' (this run's '$(plain "$VERSION")'), source '$(plain "$(label org.opencontainers.image.source)")' (this run's '$(plain "$source_url")'), platforms '$(plain "$platforms")' (this run's 'linux/amd64 linux/arm64'). A published version is never rebuilt or replaced: release a new one."
            exit 1
          fi
          index=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          {
            echo "MODE=resume"
            echo "INDEX=$index"
          } >> "$GITHUB_ENV"
          echo "$VERSION is on Docker Hub from this commit ($index): signing and floating tags remain."
      # QEMU for arm64, from tonistiigi/binfmt qemu-v10.2.1 by digest. Only
      # the production install runs emulated: the Dockerfile builds the
      # client on the runner's own platform.
      - name: arm64 emulation
        if: env.MODE == 'build'
        run: docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.1@sha256:d3b963f787999e6c0219a48dba02978769286ff61a5f4d26245cb6a6e5567ea3 --install arm64
      - name: A buildx builder
        if: env.MODE == 'build'
        run: docker buildx create --name raccoon --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --bootstrap --use
      - name: Build for linux/amd64
        if: env.MODE == 'build'
        run: |
          docker buildx build --platform linux/amd64 \
            --build-arg "VERSION=$VERSION" --build-arg "REVISION=$REVISION" --build-arg "SOURCE_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --load --tag raccoon-vtt:smoke --metadata-file "$RUNNER_TEMP/load.json" .
          config=$(jq -r '."containerimage.config.digest"' "$RUNNER_TEMP/load.json")
          manifest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/load.json")
          # The daemon names an image by its config digest, or by its
          # manifest's with the containerd image store.
          loaded=$(docker image inspect raccoon-vtt:smoke --format '{{.Id}}')
          if [ "$loaded" != "$config" ] && [ "$loaded" != "$manifest" ]; then
            echo "::error::raccoon-vtt:smoke is $loaded, not the image just built (config $config, manifest $manifest)."
            exit 1
          fi
          echo "TESTED_CONFIG=$config" >> "$GITHUB_ENV"
          echo "Built linux/amd64 with config $config."
      - name: Smoke test
        if: env.MODE == 'build'
        run: sh selfhost/smoke-test.sh raccoon-vtt:smoke
      # Both architectures into the builder's cache before the login, so the
      # emulated arm64 install never runs while the token is on disk. The
      # push below then only exports from this cache.
      - name: Build both architectures into the cache
        if: env.MODE == 'build'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$VERSION" --build-arg "REVISION=$REVISION" --build-arg "SOURCE_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
      # By digest only, so nothing is tagged until the amd64 image is shown
      # to be the one smoke-tested.
      - name: Push both architectures and check
        if: env.MODE == 'build'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          trap 'docker logout docker.io' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$VERSION" --build-arg "REVISION=$REVISION" --build-arg "SOURCE_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --provenance mode=max --sbom "generator=$SBOM_SCANNER" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/push.json" .
          # As in the check of what Docker Hub holds: the digests below come back from Docker Hub.
          plain() { local s=${1//"%"/%25}; s=${s//$'\r'/%0D}; printf '%s' "${s//$'\n'/%0A}"; }
          index=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/push.json")
          raw=$(docker buildx imagetools inspect --raw "$IMAGE@$index")
          platform() { jq -r --arg arch "$1" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' <<< "$raw"; }
          amd64=$(platform amd64)
          arm64=$(platform arm64)
          if [ -z "$amd64" ] || [ -z "$arm64" ]; then
            echo "::error::The pushed index $(plain "$index") lacks a platform: amd64 '$(plain "$amd64")', arm64 '$(plain "$arm64")'."
            exit 1
          fi
          pushed=$(docker buildx imagetools inspect --raw "$IMAGE@$amd64" | jq -r .config.digest)
          if [ "$pushed" != "$TESTED_CONFIG" ]; then
            echo "::error::The pushed linux/amd64 image has config $(plain "$pushed"), but the smoke test ran $(plain "$TESTED_CONFIG"). Nothing was tagged."
            exit 1
          fi
          echo "INDEX=$index" >> "$GITHUB_ENV"
          echo "The pushed linux/amd64 image is the one smoke-tested ($pushed): index $index, linux/amd64 $amd64, linux/arm64 $arm64."
      # If signing exhausts retries in build mode, no tag moves and a rerun rebuilds.
      - name: Install Cosign
        run: |
          curl -fsSL --retry 3 --max-time 60 --output "$RUNNER_TEMP/cosign" \
            https://github.com/sigstore/cosign/releases/download/v3.0.6/cosign-linux-amd64
          echo "c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74  $RUNNER_TEMP/cosign" | sha256sum -c --quiet -
          chmod +x "$RUNNER_TEMP/cosign"
      # INDEX comes only from a completed push or a verified published
      # version. Signing it again lets a stopped release resume safely.
      - name: Sign the published index
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${MODE:-}" != build && "${MODE:-}" != resume ]]; then
            echo "::error::No completed image push or verified release to sign."
            exit 1
          fi
          if ! [[ "${INDEX:-}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The published image digest is missing or invalid."
            exit 1
          fi
          trap 'docker logout docker.io' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          unset DOCKERHUB_TOKEN
          docker buildx imagetools inspect --raw "$IMAGE@$INDEX" > /dev/null
          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/cosign" sign --yes "$IMAGE@$INDEX"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not sign the published image after three attempts."
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Tag the version
        if: env.MODE == 'build'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          trap 'docker logout docker.io' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$INDEX"
          echo "Tagged $VERSION: $INDEX."
      # Floating tags move only after signing succeeds, and only over this
      # release or older ones (scripts/release-tags.ts).
      - name: Tag the floating versions
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          trap 'docker logout docker.io' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          # As in the check of what Docker Hub holds: a tag's version label and Docker Hub's errors come from Docker Hub.
          plain() { local s=${1//"%"/%25}; s=${s//$'\r'/%0D}; printf '%s' "${s//$'\n'/%0A}"; }
          # The version a tag holds now, or "none" when Docker Hub has no such tag.
          holds() {
            local out
            if out=$(docker buildx imagetools inspect "$IMAGE:$1" --format '{{json .Image}}' 2>&1); then
              jq -r '."linux/amd64".config.Labels["org.opencontainers.image.version"] // empty' <<< "$out"
              return
            fi
            case $out in
              *"not found"*) echo none ;;
              *) echo "::error::Could not read $(plain "$1") on Docker Hub: $(plain "$out")" >&2; return 1 ;;
            esac
          }
          minor_holds=$(holds "$MINOR")
          latest_holds=$(holds latest)
          node_image=$(sed -n 's/^ARG NODE_IMAGE=//p' Dockerfile)
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" --workdir /repo "$node_image" \
            node scripts/release-tags.ts "$VERSION" "$minor_holds" "$latest_holds" > "$RUNNER_TEMP/floating.env"
          . "$RUNNER_TEMP/floating.env"
          args=()
          if [ "$TAG_MINOR" = true ]; then args+=(--tag "$IMAGE:$MINOR"); else echo "::warning::$(plain "$MINOR") stays at $(plain "$minor_holds"), which is newer than $(plain "$VERSION")."; fi
          if [ "$TAG_LATEST" = true ]; then args+=(--tag "$IMAGE:latest"); else echo "::warning::latest stays at $(plain "$latest_holds"), which is newer than $(plain "$VERSION")."; fi
          if [ "${#args[@]}" -gt 0 ]; then
            docker buildx imagetools create "${args[@]}" "$IMAGE@$INDEX"
          fi
          echo "$VERSION is $INDEX. $MINOR: $([ "$TAG_MINOR" = true ] && echo "moved here" || echo "stays at $minor_holds"). latest: $([ "$TAG_LATEST" = true ] && echo "moved here" || echo "stays at $latest_holds")."
      - name: Remove the builder
        if: always() && env.MODE == 'build'
        run: docker buildx rm raccoon || true

  release-notes:
    needs: publish
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      content: ${{ steps.notes.outputs.content }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Generate this release's notes
        id: notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --current --strip header
          github_token: ${{ github.token }}

  release:
    needs: [publish, release-notes]
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ needs.release-notes.outputs.content }}
        run: |
          if found=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" 2>&1); then
            echo "Release $TAG already exists. Leaving it unchanged."
          elif [ "$found" = "release not found" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$TAG" --notes "$NOTES"
          else
            printf '%s\n' "$found" >&2
            exit 1
          fi
