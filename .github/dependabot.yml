version: 2
updates:
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
      day: tuesday
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: wednesday
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      docker:
        patterns: ["*"]
  # Compose has its own updater. Changes to selfhost/compose.yml also need
  # their source updated and `pnpm selfhost` run before merging.
  # scripts/supply-chain.test.ts requires CI's PostgreSQL service digests
  # to follow docker-compose.yml's pin before a Compose update can merge.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /selfhost
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: thursday
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      docker-compose:
        patterns: ["*"]
