version: 2
# The Node image is updated by hand in Dockerfile's ARG NODE_IMAGE.
# Dependabot's Docker parser does not expand ARG references in FROM lines.
updates:
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Etc/UTC
    # The runtime is Node 24, so @types/node follows the Node major and never jumps ahead of it.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        patterns: ["*"]
        update-types: [major]
  # The desktop app's own packages (Electron and the packaging tools), a pnpm
  # root of its own with its own lockfile. ci.yml never installs them, and
  # desktop.yml runs on ci/ branches only, so push an update's commit to a
  # ci/ branch and let desktop.yml pass before merging it. The Node and
  # PostgreSQL the app bundles are pinned in desktop/pins.json and updated
  # by hand.
  - package-ecosystem: npm
    directory: /desktop
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
      day: wednesday
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      desktop-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      desktop-major:
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
      day: tuesday
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
  # Compose has its own updater. Changes to selfhost/compose.yml also need
  # their source updated and `pnpm selfhost` run before merging.
  # scripts/supply-chain.test.ts requires CI's PostgreSQL service digests
  # to follow docker-compose.yml's pin before a Compose update can merge.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /selfhost
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: thursday
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      docker-compose:
        patterns: ["*"]
