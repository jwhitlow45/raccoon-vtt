version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      docker:
        patterns: ["*"]
  # Compose has its own updater. Changes to selfhost/compose.yml also need
  # their source updated and `pnpm selfhost` run before merging.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /selfhost
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      docker-compose:
        patterns: ["*"]
